name: ble_attendance_app
description: TrueSign Class Rep - Professional attendance tracking for class representatives.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bluetooth_low_energy: ^6.0.2
  webview_flutter: ^4.8.0
  flutter_native_splash: ^2.4.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  permission_handler: ^11.3.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/favicon.png"
  adaptive_icon_background: "#091C3E"
  adaptive_icon_foreground: "images/favicon.png"

flutter_native_splash:
  color: "#091C3E"
  image: images/favicon.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - images/

